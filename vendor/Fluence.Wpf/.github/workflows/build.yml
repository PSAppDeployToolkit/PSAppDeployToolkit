name: Build & Test

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# A newer push to the same pull request cancels the run it supersedes. Main and tag runs each get
# a group of their own, because a new run replaces a pending run in its group even without
# cancel-in-progress. They are never cancelled or replaced, so a release cannot stop partway
# through publication.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The NuGet cache is keyed on the committed lock files, which RestoreLockedMode keeps
      # exact in CI, so a package version change produces a new cache entry.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Tag runs fail here, before the build and test gates, when the tag cannot be released.
      # The release job repeats both checks as its final gate before publication.
      - name: Verify tag, tree version, and changelog section
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (dotnet msbuild Fluence.Wpf/Fluence.Wpf.csproj -getProperty:Version -p:TargetFramework=net472 -nologo).Trim()
          if ($env:TAG -ne "v$version") {
            Write-Error "Tag $env:TAG does not match the tree version, which is v$version. Bump VersionPrefix and VersionSuffix in Directory.Build.props, or delete the tag and re-tag the right commit."
            exit 1
          }
          if (-not (Select-String -Path CHANGELOG.md -Pattern ('^##\s+\[' + [regex]::Escape($version) + '\]') -Quiet)) {
            Write-Error "CHANGELOG.md has no '## [$version]' section. Add one before tagging."
            exit 1
          }
          Write-Host "Tag $env:TAG matches the tree version and has a changelog section."

      - name: Check text policy (UTF-8 BOM, LF, banned APIs, hard-coded hex, em/en dashes)
        run: pwsh .claude/hooks/post-tool-util.ps1 -CheckAll

      - name: Restore
        run: dotnet restore Fluence.Wpf.sln

      - name: Build solution (Release)
        run: dotnet build Fluence.Wpf.sln -c Release --no-restore -v minimal

      - name: Generate API references in ignored staging
        run: pwsh -NoProfile -File tools/ApiDocs/Generate-ApiDocs.ps1 -Configuration Release -OutputRoot artifacts/docs/api -CoveragePath artifacts/docs/coverage.md

      - name: Check generated API references
        run: pwsh -NoProfile -File tools/ApiDocs/Generate-ApiDocs.ps1 -Configuration Release -OutputRoot artifacts/docs/api -CoveragePath artifacts/docs/coverage.md -Check

      # dotnet format is the tidiness gate: whitespace, code style (IDE####), and any analyzer
      # diagnostic at info severity or above that ships a working Fix All provider.
      - name: Check formatting (dotnet format)
        run: dotnet format Fluence.Wpf.sln --verify-no-changes --severity info --no-restore

      # Screenshots-category tests are PNG regenerators (no pass/fail assertion beyond
      # "rendered without throwing"); they are opt-in capture candidates and are
      # skipped here. Published website images require a separate visual review.
      #
      # The suite runs on Microsoft Testing Platform, so these steps invoke the built test
      # executable rather than dotnet test: the VSTest target the previous steps used is
      # rejected outright by MTP on the .NET 10 SDK. Trait filtering is by the xunit trait
      # name (Category), not TestCategory.
      #
      # Each TFM runs as two complementary lanes. A single-process whole-assembly run on
      # net472 aborts with exit -1 at a non-deterministic point (see KNOWN_ISSUES.md). The
      # lanes are exact complements of one explicit class list, so their union is provably
      # the whole assembly and a newly added class lands in lane B automatically. The sum
      # check below is what turns that into a guarantee.
      - name: Test (.NET Framework 4.7.2, lane A)
        run: Fluence.Wpf.Tests\bin\Release\net472\Fluence.Wpf.Tests.exe --filter-class Fluence.Wpf.Tests.Gallery.DemoShellTests Fluence.Wpf.Tests.Gallery.DemoSampleContractTests Fluence.Wpf.Tests.Control.NavigationViewTests Fluence.Wpf.Tests.Control.ProgressBarTests Fluence.Wpf.Tests.Control.ContentDialogTests Fluence.Wpf.Tests.Control.ColorPickerTests Fluence.Wpf.Tests.Control.TimePickerTests --filter-not-trait "Category=Screenshots" --report-xunit-trx --report-xunit-trx-filename net472.laneA.trx --results-directory TestResults/net472 --no-ansi --progress off
        shell: cmd

      - name: Test (.NET Framework 4.7.2, lane B)
        run: Fluence.Wpf.Tests\bin\Release\net472\Fluence.Wpf.Tests.exe --filter-not-class Fluence.Wpf.Tests.Gallery.DemoShellTests Fluence.Wpf.Tests.Gallery.DemoSampleContractTests Fluence.Wpf.Tests.Control.NavigationViewTests Fluence.Wpf.Tests.Control.ProgressBarTests Fluence.Wpf.Tests.Control.ContentDialogTests Fluence.Wpf.Tests.Control.ColorPickerTests Fluence.Wpf.Tests.Control.TimePickerTests --filter-not-trait "Category=Screenshots" --report-xunit-trx --report-xunit-trx-filename net472.laneB.trx --results-directory TestResults/net472 --no-ansi --progress off
        shell: cmd

      - name: Test (.NET 10, lane A)
        run: Fluence.Wpf.Tests\bin\Release\net10.0-windows10.0.26100.0\Fluence.Wpf.Tests.exe --filter-class Fluence.Wpf.Tests.Gallery.DemoShellTests Fluence.Wpf.Tests.Gallery.DemoSampleContractTests Fluence.Wpf.Tests.Control.NavigationViewTests Fluence.Wpf.Tests.Control.ProgressBarTests Fluence.Wpf.Tests.Control.ContentDialogTests Fluence.Wpf.Tests.Control.ColorPickerTests Fluence.Wpf.Tests.Control.TimePickerTests --filter-not-trait "Category=Screenshots" --report-xunit-trx --report-xunit-trx-filename net10.laneA.trx --results-directory TestResults/net10 --no-ansi --progress off
        shell: cmd

      - name: Test (.NET 10, lane B)
        run: Fluence.Wpf.Tests\bin\Release\net10.0-windows10.0.26100.0\Fluence.Wpf.Tests.exe --filter-not-class Fluence.Wpf.Tests.Gallery.DemoShellTests Fluence.Wpf.Tests.Gallery.DemoSampleContractTests Fluence.Wpf.Tests.Control.NavigationViewTests Fluence.Wpf.Tests.Control.ProgressBarTests Fluence.Wpf.Tests.Control.ContentDialogTests Fluence.Wpf.Tests.Control.ColorPickerTests Fluence.Wpf.Tests.Control.TimePickerTests --filter-not-trait "Category=Screenshots" --report-xunit-trx --report-xunit-trx-filename net10.laneB.trx --results-directory TestResults/net10 --no-ansi --progress off
        shell: cmd

      # The library ships three target frameworks and the suite above covers two of them. This
      # lane loads the third, which is the one AGENTS.md designates for PowerShell 7 in-process
      # consumption and the only one carrying WinRT.Runtime.dll, so the shipped binary is
      # exercised rather than only built and packed. It is a smoke lane by design: the behaviour
      # coverage lives in the two full lanes, where the source is identical.
      - name: Test (.NET 8, smoke lane)
        run: Fluence.Wpf.Tests.Smoke\bin\Release\net8.0-windows10.0.26100.0\Fluence.Wpf.Tests.Smoke.exe --report-xunit-trx --report-xunit-trx-filename net8.smoke.trx --results-directory TestResults/net8 --no-ansi --progress off
        shell: cmd

      # The lanes are complements, so their case counts must sum to the whole assembly. This
      # catches a typo that makes one filter diverge from the other, since the split then goes
      # out of balance. It does not catch the same typo repeated identically in both filters:
      # that would leave lane A empty and lane B carrying the whole assembly, and the sum is
      # unchanged, though a single-process net472 run still aborts loudly (see KNOWN_ISSUES.md).
      # The floors combine the integrated branches and subsequent measured ordinary TRX case deltas
      # after the Screenshots-category filter. TRX total includes skips; net472 discovery can
      # collapse theory rows that expand at runtime. Recheck both target frameworks when test
      # discovery changes, and update these floors alongside Fluence.Wpf.Tests/Baselines.
      - name: Check lane case-count sums
        shell: pwsh
        run: |
          $floor = @{ 'net472' = 1584; 'net10' = 1588 }
          foreach ($tfm in $floor.Keys) {
            $total = 0
            foreach ($lane in 'laneA', 'laneB') {
              $path = "TestResults/$tfm/$tfm.$lane.trx"
              if (-not (Test-Path $path)) { Write-Error "Missing $path"; continue }
              [xml]$trx = Get-Content $path
              $total += [int]$trx.TestRun.ResultSummary.Counters.total
            }
            if ($total -lt $floor[$tfm]) {
              Write-Error "$tfm : lanes summed to $total, below the floor of $($floor[$tfm]). Either a lane filter dropped cases, or cases were removed on purpose: in that case lower the floor in .github/workflows/build.yml and update Fluence.Wpf.Tests/Baselines."
            } else {
              Write-Host "$tfm : $total cases across both lanes."
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fluence-wpf-test-results
          path: TestResults/
          retention-days: 14

      - name: Upload library artifacts (.NET 10.x)
        uses: actions/upload-artifact@v7
        with:
          name: fluence-wpf-release-dotnet10
          path: |
            Fluence.Wpf/bin/Release/net10.0-windows10.0.26100.0/Fluence.Wpf.dll
            Fluence.Wpf/bin/Release/net10.0-windows10.0.26100.0/Fluence.Wpf.pdb
            Fluence.Wpf/bin/Release/net10.0-windows10.0.26100.0/Fluence.Wpf.xml
            Fluence.Wpf/bin/Release/net10.0-windows10.0.26100.0/Microsoft.Windows.SDK.NET.dll
            Fluence.Wpf/bin/Release/net10.0-windows10.0.26100.0/WinRT.Runtime.dll
          retention-days: 30

      - name: Upload library artifacts (.NET 8)
        uses: actions/upload-artifact@v7
        with:
          name: fluence-wpf-release-dotnet8
          path: |
            Fluence.Wpf/bin/Release/net8.0-windows10.0.26100.0/Fluence.Wpf.dll
            Fluence.Wpf/bin/Release/net8.0-windows10.0.26100.0/Fluence.Wpf.pdb
            Fluence.Wpf/bin/Release/net8.0-windows10.0.26100.0/Fluence.Wpf.xml
            Fluence.Wpf/bin/Release/net8.0-windows10.0.26100.0/Microsoft.Windows.SDK.NET.dll
            Fluence.Wpf/bin/Release/net8.0-windows10.0.26100.0/WinRT.Runtime.dll
          retention-days: 30

      - name: Upload library artifacts (.NET Framework 4.7.2)
        uses: actions/upload-artifact@v7
        with:
          name: fluence-wpf-release-dotnet472
          path: |
            Fluence.Wpf/bin/Release/net472/*.dll
            Fluence.Wpf/bin/Release/net472/Fluence.Wpf.pdb
            Fluence.Wpf/bin/Release/net472/Fluence.Wpf.xml
          retention-days: 30

      - name: Upload demo application
        uses: actions/upload-artifact@v7
        with:
          name: fluence-wpf-demo
          path: Fluence.Wpf.Demo/bin/Release/net472/
          retention-days: 30

      - name: Pack NuGet
        run: dotnet pack Fluence.Wpf/Fluence.Wpf.csproj -c Release --no-build -o nupkg/

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: fluence-wpf-nupkg
          path: |
            nupkg/*.nupkg
            nupkg/*.snupkg
          retention-days: 30

  # Script-module tooling and tests do not block library artifact creation; both
  # jobs must pass before the combined release publishes either package.
  # This job consumes the exact binaries uploaded by build; no second library build is needed.
  powershell:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download library binaries (.NET Framework 4.7.2)
        uses: actions/download-artifact@v8
        with:
          name: fluence-wpf-release-dotnet472
          path: Fluence.Wpf/bin/Release/net472

      - name: Download library binaries (.NET 8)
        uses: actions/download-artifact@v8
        with:
          name: fluence-wpf-release-dotnet8
          path: Fluence.Wpf/bin/Release/net8.0-windows10.0.26100.0

      - name: Download library binaries (.NET 10)
        uses: actions/download-artifact@v8
        with:
          name: fluence-wpf-release-dotnet10
          path: Fluence.Wpf/bin/Release/net10.0-windows10.0.26100.0

      # Restores the CurrentUser modules and NuGet provider the next two steps install. Their
      # version checks then skip PowerShell Gallery. Change the key when a pinned version changes;
      # a stale key only costs a reinstall.
      - name: Cache pinned PowerShell build tools
        uses: actions/cache@v6
        with:
          path: |
            ~/Documents/WindowsPowerShell/Modules
            ~/Documents/PowerShell/Modules
            ~/AppData/Local/PackageManagement/ProviderAssemblies
          key: ${{ runner.os }}-psmodules-nuget2.8.5.208-psscriptanalyzer1.25.0-pester5.8.0-alt3docusaurus2.0.1

      # Network setup is explicit and isolated from local package creation. Windows PowerShell
      # needs the external NuGet provider; PowerShell 7 uses its bundled provider.
      - name: Install pinned build tools (Windows PowerShell)
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              if (-not (Get-PackageProvider -Name NuGet -ListAvailable -ErrorAction SilentlyContinue | Where-Object { $_.Version -eq [version]'2.8.5.208' })) {
                Install-PackageProvider -Name NuGet -RequiredVersion 2.8.5.208 -Scope CurrentUser -Force -ErrorAction Stop
              }
              $needAnalyzer = -not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object { $_.Version -eq [version]'1.25.0' })
              $needPester = -not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]'5.8.0' })
              if (($needAnalyzer -or $needPester) -and -not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                Register-PSRepository -Default -ErrorAction Stop
              }
              if ($needAnalyzer) {
                Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Scope CurrentUser -Force -ErrorAction Stop
              }
              if ($needPester) {
                Install-Module Pester -RequiredVersion 5.8.0 -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
              }
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "Build-tool installation attempt $attempt failed: $_. Retrying in 15 seconds."
              Start-Sleep -Seconds 15
            }
          }

      - name: Install pinned build tools (PowerShell 7)
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              $needAnalyzer = -not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object { $_.Version -eq [version]'1.25.0' })
              $needPester = -not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]'5.8.0' })
              $needDocs = -not (Get-Module -ListAvailable Alt3.Docusaurus.Powershell | Where-Object { $_.Version -eq [version]'2.0.1' })
              if (($needAnalyzer -or $needPester -or $needDocs) -and -not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                Register-PSRepository -Default -ErrorAction Stop
              }
              if ($needAnalyzer) {
                Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Scope CurrentUser -Force -ErrorAction Stop
              }
              if ($needPester) {
                Install-Module Pester -RequiredVersion 5.8.0 -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
              }
              if ($needDocs) {
                Install-Module Alt3.Docusaurus.Powershell -RequiredVersion 2.0.1 -Repository PSGallery -Scope CurrentUser -Force -ErrorAction Stop
              }
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "Build-tool installation attempt $attempt failed: $_. Retrying in 15 seconds."
              Start-Sleep -Seconds 15
            }
          }

      - name: Stage PowerShell module libraries
        run: pwsh -NoProfile -File Fluence.Wpf.PowerShell.Module/build/Build-Module.ps1 -Configuration Release

      - name: Generate PowerShell references in ignored staging
        run: pwsh -NoProfile -File tools/Docs/Generate-PowerShellReference.ps1 -OutputRoot artifacts/docs/powershell/reference

      - name: Check generated PowerShell references
        run: pwsh -NoProfile -File tools/Docs/Generate-PowerShellReference.ps1 -OutputRoot artifacts/docs/powershell/reference -Check

      - name: Test documentation tooling (PowerShell 7)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.8.0 -ErrorAction Stop
          $testPaths = @(
            'tools/ApiDocs/Generate-ApiDocs.Tests.ps1',
            'Fluence.Wpf.PowerShell.Module/tests/Generate-PowerShellReference.Tests.ps1',
            'tools/Docs/SourceDocsManifest.Tests.ps1',
            'tools/Docs/Sync-WebsiteDocs.Tests.ps1',
            'tools/Docs/Select-VisualCaptures.Tests.ps1',
            'tools/Docs/Review-VisualCaptures.Tests.ps1'
          )
          $result = Invoke-Pester -Path $testPaths -PassThru
          if ($result.Result -ne 'Passed') { throw "Documentation tooling tests ended with $($result.Result); $($result.FailedCount) assertion(s) failed." }

      - name: Test PowerShell module (PowerShell 7)
        run: pwsh -NoProfile -File Fluence.Wpf.PowerShell.Module/build/Test-Module.ps1 -TestResultPath TestResults/psmodule/pwsh.xml

      - name: Test PowerShell module (PowerShell 7, MTA)
        run: pwsh -NoProfile -MTA -File Fluence.Wpf.PowerShell.Module/build/Test-Module.ps1 -SkipAnalyzer -TestResultPath TestResults/psmodule/pwsh-mta.xml

      - name: Test PowerShell module (Windows PowerShell 5.1)
        shell: cmd
        run: powershell.exe -NoProfile -STA -File Fluence.Wpf.PowerShell.Module/build/Test-Module.ps1 -TestResultPath TestResults/psmodule/desktop.xml

      - name: Package PowerShell module
        run: pwsh -NoProfile -File Fluence.Wpf.PowerShell.Module/build/Package-Module.ps1 -Configuration Release -UseExistingBuild

      - name: Upload PowerShell module package
        uses: actions/upload-artifact@v7
        with:
          name: fluence-ps-module-package
          path: Fluence.Wpf.PowerShell.Module/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload PowerShell module test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fluence-ps-module-test-results
          path: TestResults/psmodule/
          retention-days: 14

  # Version tags (v*) run the .NET and PowerShell build/test/package gates above.
  # v0.9.5 is build-only: publishing it later requires a separately authorized
  # release workflow, because rerunning this tag's workflow retains this guard.
  # Other version tags publish a GitHub release and packages to nuget.org and
  # PowerShell Gallery. Tags carrying a
  # SemVer prerelease identifier are marked as prereleases. Write permission is
  # scoped to this job only; the build job stays read-only.
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/tags/v0.9.5'
    needs: [build, powershell]
    runs-on: windows-latest
    timeout-minutes: 15
    # The job runs in the "release" environment so its public release and package publication
    # steps can sit behind a required reviewer. Configure the release environment
    # in repository settings so the publishing job cannot proceed without review.
    environment: release
    permissions:
      contents: write
      id-token: write
    # Scripts read the tag from the environment rather than from an expression expanded into
    # their source, so a tag name cannot alter the script text.
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Runs before anything is published. A v1.0.0 tag on a tree still at
      # 0.9.0-pre would otherwise publish a mislabeled package to nuget.org,
      # which can only be unlisted, never replaced.
      - name: Verify the tag matches the tree version
        run: |
          $version = (dotnet msbuild Fluence.Wpf/Fluence.Wpf.csproj -getProperty:Version -p:TargetFramework=net472 -nologo).Trim()
          $expected = "v$version"
          if ($env:TAG -ne $expected) {
            Write-Error "Tag $env:TAG does not match the tree version, which is $expected. Bump VersionPrefix and VersionSuffix in Directory.Build.props, or delete the tag and re-tag the right commit."
            exit 1
          }
          Write-Host "Tag $env:TAG matches the tree version $version."

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: fluence-wpf-*
          path: artifacts

      - name: Download PowerShell module package
        uses: actions/download-artifact@v8
        with:
          name: fluence-ps-module-package
          path: artifacts/fluence-ps-module-package

      - name: Stage release assets
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path artifacts/fluence-wpf-release-dotnet472/* -DestinationPath "dist/Fluence.Wpf-${env:TAG}-net472.zip"
          Compress-Archive -Path artifacts/fluence-wpf-release-dotnet8/* -DestinationPath "dist/Fluence.Wpf-${env:TAG}-net8.0-windows.zip"
          Compress-Archive -Path artifacts/fluence-wpf-release-dotnet10/* -DestinationPath "dist/Fluence.Wpf-${env:TAG}-net10.0-windows.zip"
          Compress-Archive -Path artifacts/fluence-wpf-demo/* -DestinationPath "dist/Fluence.Wpf.Demo-${env:TAG}-net472.zip"
          Copy-Item artifacts/fluence-wpf-nupkg/*.nupkg dist/
          Copy-Item artifacts/fluence-wpf-nupkg/*.snupkg dist/
          Copy-Item artifacts/fluence-ps-module-package/*.zip dist/
          Copy-Item artifacts/fluence-ps-module-package/*.nupkg dist/
          Expand-Archive -Path (Get-ChildItem artifacts/fluence-ps-module-package/*.zip | Select-Object -First 1).FullName -DestinationPath module-release

      # The release notes are the CHANGELOG section for this version, not
      # commit-generated prose. A missing section fails the job: shipping a
      # release with no notes is worse than not shipping it.
      - name: Slice the changelog for this version
        run: |
          $version = $env:TAG.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match ('^##\s+\[' + [regex]::Escape($version) + '\]')) { $start = $i; break }
          }
          if ($start -lt 0) {
            Write-Error "CHANGELOG.md has no '## [$version]' section. Add one before tagging."
            exit 1
          }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s+\[') { $end = $i; break }
          }
          $slice = $lines[($start + 1)..($end - 1)]
          Set-Content -Path release-notes.md -Value $slice -Encoding utf8NoBOM
          Write-Host "Release notes:"
          Get-Content release-notes.md

      - name: Verify publication identity and credentials are configured
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw 'NUGET_USER must be set to the nuget.org profile username in the release environment.'
          }
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
            throw 'PSGALLERY_API_KEY is not configured for the release job.'
          }

      # Exchange the release job's GitHub OIDC token before creating a public release.
      # A missing or mismatched nuget.org trusted-publishing policy fails here.
      - name: NuGet login (OIDC)
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Verify NuGet login returned a temporary API key
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'NuGet login did not return a temporary API key.'
          }

      # gh release create fails outright if a release for this tag already exists,
      # which is exactly what a re-run after a failed NuGet push below hits: the
      # release published fine the first time, only the push failed. Checking
      # first lets a re-run reach the push instead of dying here every time.
      # Refresh the assets from this run's verified artifacts when the release
      # exists, so recovery does not leave packages from an earlier failed run.
      # Keep the existing release notes and metadata.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseExists = $false
          try {
            gh release view $env:TAG --repo '${{ github.repository }}' *> $null
            $releaseExists = ($LASTEXITCODE -eq 0)
          } catch {
            $releaseExists = $false
          }
          if ($releaseExists) {
            $assets = @(Get-ChildItem -Path dist -File | ForEach-Object FullName)
            if ($assets.Count -eq 0) {
              throw 'No staged release assets were found in dist.'
            }
            Write-Host "Release $env:TAG already exists. Refreshing its assets from this run's verified artifacts."
            gh release upload $env:TAG @assets --repo '${{ github.repository }}' --clobber
            if ($LASTEXITCODE -ne 0) {
              throw 'Refreshing the existing GitHub release assets failed.'
            }
          } else {
            $ghArgs = @('release', 'create', $env:TAG, '--repo', '${{ github.repository }}')
            $ghArgs += (Get-ChildItem dist/* | ForEach-Object FullName)
            $ghArgs += @('--title', "Fluence.Wpf $env:TAG", '--notes-file', 'release-notes.md', '--verify-tag')
            # Any SemVer prerelease identifier (-rc.1, -preview, -beta) marks a prerelease.
            if ($env:TAG.Contains('-')) { $ghArgs += '--prerelease' }
            gh @ghArgs
          }

      # After GitHub release creation, so a failure in that step does not leave a package on
      # nuget.org that cannot be replaced. dotnet nuget push also pushes the
      # sibling .snupkg. --skip-duplicate makes a retry safe after a successful
      # push. The path is scoped to the library so the PowerShell Gallery package
      # attached to the release is not sent to nuget.org.
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          # PowerShell does not expand wildcards for native commands, so resolve
          # the package path before passing it to dotnet.
          $packages = @(Get-ChildItem -Path 'artifacts/fluence-wpf-nupkg' -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1) {
            throw "Expected one Fluence.Wpf NuGet package, found $($packages.Count)."
          }
          dotnet nuget push $packages[0].FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      # The ZIP and Gallery-format NUPKG are attached to GitHub above. Publish
      # the packaged module source to PSGallery only after the NuGet push
      # succeeds. The release environment reviewer gates this public action too.
      - name: Publish PowerShell module to PowerShell Gallery
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $modulePath = Join-Path $PWD 'module-release/Fluence.Wpf.PowerShell'
          $manifestPath = Join-Path $modulePath 'Fluence.Wpf.PowerShell.psd1'
          $manifest = Import-PowerShellDataFile $manifestPath
          $moduleName = Split-Path $modulePath -Leaf
          $version = [string]$manifest.ModuleVersion
          if (-not [string]::IsNullOrWhiteSpace($manifest.PrivateData.PSData.Prerelease)) {
            $version = '{0}-{1}' -f $version, $manifest.PrivateData.PSData.Prerelease.TrimStart('-')
          }
          $published = Find-Module -Name $moduleName -RequiredVersion $version -AllowPrerelease -ErrorAction SilentlyContinue
          if ($null -ne $published) {
            Write-Host "PowerShell Gallery already contains $moduleName $version; skipping duplicate publication."
          } else {
            Publish-Module -Path $modulePath -Repository PSGallery -NuGetApiKey $env:PSGALLERY_API_KEY -Force
          }
